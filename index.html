<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZOMBIE APOCALYPSE: LAST SURVIVOR</title>
<style>
  :root {
    --bg-dark: #0d0f12;
    --panel-bg: rgba(18, 22, 28, 0.94);
    --panel-border: #3a4452;
    --accent: #d9534f;
    --accent-hover: #e66763;
    --gold: #e6a838;
    --green: #4caf50;
    --blue: #3b82f6;
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --font-ui: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); color: var(--text-main); font-family: var(--font-ui); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

  /* OVERLAYS & MENUS */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; background: rgba(10, 12, 15, 0.88); backdrop-filter: blur(4px); transition: opacity 0.25s; }
  .hidden { display: none !important; opacity: 0; pointer-events: none; }

  #main-menu { background: radial-gradient(circle at center, rgba(20,25,32,0.75) 0%, rgba(8,10,12,0.95) 100%); }
  .game-title { font-size: clamp(24px, 5vw, 54px); font-weight: 900; letter-spacing: 3px; text-align: center; color: #f8fafc; text-shadow: 0 4px 0 #7f1d1d, 0 0 25px rgba(220, 38, 38, 0.6); margin-bottom: 6px; padding: 0 12px; }
  .game-subtitle { font-size: clamp(12px, 2vw, 18px); letter-spacing: 6px; color: var(--accent); font-weight: 700; margin-bottom: 32px; text-transform: uppercase; }
  .menu-btn-group { display: flex; flex-direction: column; gap: 12px; width: min(300px, 80vw); }
  .btn { background: linear-gradient(180deg, #272f3b 0%, #1a2028 100%); border: 1px solid var(--panel-border); color: var(--text-main); padding: 12px 18px; font-size: 15px; font-weight: 700; border-radius: 6px; cursor: pointer; text-align: center; transition: all 0.15s; letter-spacing: 1px; }
  .btn:hover:not(:disabled) { border-color: var(--accent); background: #2d3644; transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(180deg, #b91c1c 0%, #7f1d1d 100%); border-color: #ef4444; }
  .btn-primary:hover:not(:disabled) { background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%); }
  .btn-sm { padding: 6px 10px; font-size: 12px; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .hud-top-left { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 5px; background: rgba(13, 16, 21, 0.8); padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); min-width: 190px; }
  .stat-row { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; }
  .stat-label { width: 46px; color: var(--text-muted); }
  .bar-wrap { flex: 1; height: 9px; background: #1e242d; border-radius: 4px; overflow: hidden; border: 1px solid #000; }
  .bar-fill { height: 100%; transition: width 0.2s; }
  .bar-hp { background: #ef4444; }
  .bar-hunger { background: #f59e0b; }
  .bar-thirst { background: #3b82f6; }
  .bar-stamina { background: #10b981; }
  .bar-inf { background: #a855f7; }
  .stat-val { width: 32px; text-align: right; font-size: 10px; }

  .hud-top-center { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(13, 16, 21, 0.82); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); display: flex; gap: 12px; align-items: center; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .zone-badge { color: var(--gold); }
  .stealth-badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; background: #1e293b; color: #38bdf8; }
  .stealth-danger { background: #7f1d1d; color: #fca5a5; }

  .hud-top-right { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
  #minimap-canvas { width: 110px; height: 110px; background: #090b0e; border: 2px solid var(--panel-border); border-radius: 6px; cursor: pointer; }
  .quick-nav { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; max-width: 240px; }
  .nav-pill { background: rgba(24, 29, 37, 0.92); border: 1px solid var(--panel-border); color: var(--text-main); padding: 5px 8px; border-radius: 5px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .nav-pill:hover { border-color: var(--gold); color: var(--gold); }

  .hud-bottom-center { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: auto; background: rgba(13, 16, 21, 0.85); padding: 6px; border-radius: 8px; border: 1px solid var(--panel-border); }
  .hotbar-slot { width: 46px; height: 46px; background: #1a2029; border: 2px solid #2e3746; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; font-size: 10px; text-align: center; padding: 2px; }
  .hotbar-slot.active { border-color: var(--gold); background: #262f3d; }
  .hotbar-key { position: absolute; top: 2px; left: 4px; font-size: 9px; color: var(--text-muted); }
  .hotbar-qty { position: absolute; bottom: 2px; right: 4px; font-size: 10px; font-weight: 700; color: #fff; }
  .hotbar-dur { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--green); }

  /* QUEST TRACKER & NOTIFICATIONS */
  #quest-tracker { position: absolute; top: 132px; left: 10px; background: rgba(13, 16, 21, 0.72); border-left: 3px solid var(--gold); padding: 6px 10px; border-radius: 0 6px 6px 0; max-width: 220px; font-size: 11px; }
  #quest-tracker h4 { color: var(--gold); font-size: 11px; margin-bottom: 2px; }
  #toast-container { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 4px; z-index: 40; pointer-events: none; align-items: center; }
  .toast { background: rgba(15, 23, 42, 0.92); border: 1px solid var(--gold); color: #fff; padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; animation: fadeUp 0.2s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* INTERACTION / LOOT PROGRESS */
  #action-bar-wrap { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); width: 200px; background: rgba(0,0,0,0.85); border: 1px solid var(--gold); border-radius: 6px; padding: 6px; text-align: center; z-index: 25; }
  #action-label { font-size: 11px; font-weight: 700; margin-bottom: 4px; color: var(--gold); }
  #action-fill { height: 8px; width: 0%; background: var(--gold); border-radius: 3px; }

  /* MOBILE CONTROLS */
  #mobile-controls { position: fixed; inset: 0; pointer-events: none; z-index: 15; }
  #joystick-zone { position: absolute; bottom: 24px; left: 24px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.18); pointer-events: auto; }
  #joystick-knob { position: absolute; top: 38px; left: 38px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.35); border: 2px solid #fff; pointer-events: none; }
  .mobile-actions { position: absolute; bottom: 20px; right: 20px; display: grid; grid-template-columns: repeat(3, 52px); gap: 8px; pointer-events: auto; }
  .m-btn { width: 52px; height: 52px; border-radius: 50%; background: rgba(20, 25, 33, 0.82); border: 2px solid rgba(255,255,255,0.28); color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-align: center; }
  .m-btn:active, .m-btn.active { background: var(--accent); border-color: #fff; }
  .m-btn-atk { background: rgba(185, 28, 28, 0.85); border-color: #f87171; }

  /* MODAL WINDOW */
  #modal-overlay { position: fixed; inset: 0; background: rgba(5, 7, 10, 0.82); z-index: 35; display: flex; align-items: center; justify-content: center; padding: 12px; }
  .modal-box { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 10px; width: min(820px, 96vw); max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #141820; border-bottom: 1px solid var(--panel-border); }
  .modal-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab-btn { background: #1e2530; border: 1px solid transparent; color: var(--text-muted); padding: 6px 10px; border-radius: 5px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .tab-btn.active { background: var(--accent); color: #fff; }
  .modal-close { background: #2d3644; border: none; color: #fff; width: 28px; height: 28px; border-radius: 5px; font-weight: 700; cursor: pointer; }
  .modal-body { padding: 14px; overflow-y: auto; flex: 1; font-size: 13px; touch-action: pan-y; }
  .modal-body * { touch-action: pan-y; }

  /* INVENTORY & CRAFTING GRIDS */
  .split-pane { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .split-pane { grid-template-columns: 1fr; } }
  .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
  .inv-cell { background: #181e27; border: 1px solid #2e3847; border-radius: 6px; padding: 6px 4px; text-align: center; cursor: pointer; position: relative; min-height: 64px; display: flex; flex-direction: column; justify-content: space-between; }
  .inv-cell.selected { border-color: var(--gold); background: #252e3d; }
  .inv-cell-name { font-size: 10px; font-weight: 700; line-height: 1.15; word-break: break-word; }
  .inv-cell-qty { font-size: 11px; color: var(--gold); font-weight: 800; }
  .detail-card { background: #141921; border: 1px solid #2c3545; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .list-card { background: #171d26; border: 1px solid #2c3545; border-radius: 6px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .zone-card { background: #171d26; border: 1px solid #2c3545; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .zone-card.current { border-color: var(--green); }
  .zone-card.locked { opacity: 0.55; }

  /* STORY INTRO */
  #story-modal { max-width: 560px; text-align: center; padding: 24px; line-height: 1.65; }
  #story-modal h2 { color: var(--accent); margin-bottom: 12px; }
  #story-modal p { margin-bottom: 16px; color: #cbd5e1; font-size: 14px; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- MAIN MENU -->
<div id="main-menu" class="screen">
  <div class="game-title">ZOMBIE APOCALYPSE</div>
  <div class="game-subtitle">LAST SURVIVOR</div>
  <div class="menu-btn-group">
    <button class="btn btn-primary" id="btn-new-game">NEW GAME</button>
    <button class="btn" id="btn-continue" disabled>CONTINUE</button>
    <button class="btn" id="btn-menu-settings">SETTINGS</button>
    <button class="btn" id="btn-credits">CREDITS</button>
  </div>
</div>

<!-- STORY INTRO / DIALOGUE OVERLAY -->
<div id="story-screen" class="screen hidden">
  <div class="modal-box" id="story-modal">
    <h2 id="story-title">บทที่ 1: วันแรกหลังการล่มสลาย</h2>
    <p id="story-text"></p>
    <button class="btn btn-primary" id="btn-story-next">ออกเดินทาง</button>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-top-left">
    <div class="stat-row"><span class="stat-label">HP</span><div class="bar-wrap"><div class="bar-fill bar-hp" id="hud-hp" style="width:100%"></div></div><span class="stat-val" id="txt-hp">100</span></div>
    <div class="stat-row"><span class="stat-label">อาหาร</span><div class="bar-wrap"><div class="bar-fill bar-hunger" id="hud-hunger" style="width:100%"></div></div><span class="stat-val" id="txt-hunger">100</span></div>
    <div class="stat-row"><span class="stat-label">น้ำ</span><div class="bar-wrap"><div class="bar-fill bar-thirst" id="hud-thirst" style="width:100%"></div></div><span class="stat-val" id="txt-thirst">100</span></div>
    <div class="stat-row"><span class="stat-label">พลังงาน</span><div class="bar-wrap"><div class="bar-fill bar-stamina" id="hud-stamina" style="width:100%"></div></div><span class="stat-val" id="txt-stamina">100</span></div>
    <div class="stat-row"><span class="stat-label">ติดเชื้อ</span><div class="bar-wrap"><div class="bar-fill bar-inf" id="hud-inf" style="width:0%"></div></div><span class="stat-val" id="txt-inf">0%</span></div>
    <div style="font-size:10px;color:#94a3b8;display:flex;justify-content:space-between;margin-top:2px;">
      <span id="txt-lvl">LV.1 (0/100)</span>
      <span id="txt-ammo">กระสุน: 0</span>
    </div>
  </div>

  <div class="hud-top-center">
    <span class="zone-badge" id="hud-zone">ZONE 01: ABANDONED TOWN</span>
    <span id="hud-time">วันที่ 1 | 08:00 (เช้า)</span>
    <span id="hud-weather">แดดออก</span>
    <span class="stealth-badge" id="hud-stealth">ซ่อนตัว</span>
  </div>

  <div class="hud-top-right">
    <canvas id="minimap-canvas" width="110" height="110" title="คลิกเพื่อเปิดแผนที่โลก"></canvas>
    <div class="quick-nav">
      <button class="nav-pill" onclick="UI.openModal('inventory')">กระเป๋า [I]</button>
      <button class="nav-pill" onclick="UI.openModal('crafting')">คราฟต์ [C]</button>
      <button class="nav-pill" onclick="UI.openModal('building')">สร้างฐาน [B]</button>
      <button class="nav-pill" onclick="UI.openModal('map')">แผนที่ [M]</button>
      <button class="nav-pill" onclick="UI.openModal('quests')">ภารกิจ [Q]</button>
      <button class="nav-pill" onclick="UI.openModal('survivors')">ผู้รอดชีวิต</button>
      <button class="nav-pill" onclick="UI.openModal('settings')">ระบบ</button>
    </div>
  </div>

  <div id="quest-tracker">
    <h4 id="qt-title">ภารกิจหลัก</h4>
    <div id="qt-desc">สำรวจเมืองร้างและเก็บทรัพยากร</div>
  </div>

  <div class="hud-bottom-center" id="hotbar"></div>
</div>

<!-- LOOT / SLEEP PROGRESS -->
<div id="action-bar-wrap" class="hidden">
  <div id="action-label">กำลังค้นหา...</div>
  <div class="bar-wrap"><div id="action-fill"></div></div>
</div>

<!-- TOASTS -->
<div id="toast-container"></div>

<!-- MOBILE CONTROLS -->
<div id="mobile-controls" class="hidden">
  <div id="joystick-zone"><div id="joystick-knob"></div></div>
  <div class="mobile-actions">
    <button class="m-btn" id="m-sneak">ย่อง</button>
    <button class="m-btn" id="m-sprint">วิ่ง</button>
    <button class="m-btn" id="m-interact">ค้นหา/ใช้</button>
    <button class="m-btn" id="m-reload">รีโหลด</button>
    <button class="m-btn" id="m-heal">ยา/อาหาร</button>
    <button class="m-btn m-btn-atk" id="m-attack">โจมตี</button>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="hidden">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-tabs" id="modal-tabs">
        <button class="tab-btn" data-tab="inventory">กระเป๋า & อุปกรณ์</button>
        <button class="tab-btn" data-tab="crafting">โต๊ะคราฟต์</button>
        <button class="tab-btn" data-tab="building">สร้างฐาน</button>
        <button class="tab-btn" data-tab="map">แผนที่โลก</button>
        <button class="tab-btn" data-tab="quests">ภารกิจ & เนื้อเรื่อง</button>
        <button class="tab-btn" data-tab="survivors">ค่าย & ผู้รอดชีวิต</button>
        <button class="tab-btn" data-tab="settings">ตั้งค่า & บันทึก</button>
      </div>
      <button class="modal-close" id="btn-close-modal">X</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
/**
 * ZOMBIE APOCALYPSE: LAST SURVIVOR
 * Complete Modular Single-File HTML5 Survival Engine
 */

// ==========================================
// 1. DATABASE: ITEMS, RECIPES, BUILDINGS, ZONES, QUESTS
// ==========================================
const ITEMS = {
  // Weapons & Tools
  rusty_pipe: { name: 'ท่อเหล็กสนิม', type: 'weapon', sub: 'melee', dmg: 24, range: 54, rate: 0.45, noise: 110, weight: 2.0, maxDur: 80, desc: 'อาวุธระยะประชิดพื้นฐาน ทนทานพอใช้' },
  combat_knife: { name: 'มีดพกทหาร', type: 'weapon', sub: 'melee', dmg: 32, range: 46, rate: 0.3, noise: 60, weight: 0.8, maxDur: 110, desc: 'โจมตีไวและเสียงเบา เหมาะกับการลอบเร้น' },
  fire_axe: { name: 'ขวานดับเพลิง', type: 'weapon', sub: 'melee', dmg: 52, range: 62, rate: 0.65, noise: 150, weight: 3.2, maxDur: 130, desc: 'พลังทำลายสูงมาก ใช้ตัดไม้ได้ดี' },
  pistol: { name: 'ปืนพก 9mm', type: 'weapon', sub: 'ranged', dmg: 45, range: 360, rate: 0.35, noise: 480, mag: 12, ammoType: 'ammo_9mm', weight: 1.5, maxDur: 150, desc: 'ปืนพกมาตรฐาน เสียงดังดึงดูดซอมบี้' },
  shotgun: { name: 'ปืนลูกซอง', type: 'weapon', sub: 'ranged', dmg: 95, range: 230, rate: 0.85, noise: 680, mag: 6, ammoType: 'ammo_shell', weight: 3.6, maxDur: 140, desc: 'พลังยิงระยะใกล้รุนแรงมาก' },
  rifle: { name: 'ไรเฟิลจู่โจม', type: 'weapon', sub: 'ranged', dmg: 65, range: 460, rate: 0.18, noise: 620, mag: 24, ammoType: 'ammo_556', weight: 3.8, maxDur: 180, desc: 'อาวุธทหาร ยิงต่อเนื่องแม่นยำ' },
  flashlight: { name: 'ไฟฉายยุทธวิธี', type: 'tool', weight: 0.5, maxDur: 200, desc: 'ส่องสว่างในเวลากลางคืนและในอาคารมืด' },

  // Ammo
  ammo_9mm: { name: 'กระสุน 9mm', type: 'ammo', weight: 0.03, desc: 'กระสุนสำหรับปืนพก 9mm' },
  ammo_shell: { name: 'กระสุนลูกซอง', type: 'ammo', weight: 0.06, desc: 'กระสุนสำหรับปืนลูกซอง' },
  ammo_556: { name: 'กระสุน 5.56mm', type: 'ammo', weight: 0.04, desc: 'กระสุนสำหรับไรเฟิลจู่โจม' },

  // Food & Water
  canned_food: { name: 'อาหารกระป๋อง', type: 'consumable', hunger: 38, thirst: 5, hp: 4, weight: 0.6, desc: 'อาหารสำเร็จรูป เก็บได้นาน' },
  dry_ration: { name: 'อาหารแห้ง', type: 'consumable', hunger: 25, thirst: -5, hp: 2, weight: 0.3, desc: 'ให้พลังงานเร็ว แต่ทำให้หิวน้ำเล็กน้อย' },
  berry: { name: 'ผลไม้ป่า', type: 'consumable', hunger: 12, thirst: 10, hp: 2, weight: 0.1, desc: 'เก็บได้จากป่า ช่วยประทังชีวิต' },
  cooked_meat: { name: 'เนื้อย่างสุก', type: 'consumable', hunger: 55, thirst: 0, hp: 12, weight: 0.5, desc: 'อาหารชั้นดี ฟื้นฟูความหิวและพลังชีวิต' },
  clean_water: { name: 'น้ำดื่มสะอาด', type: 'consumable', hunger: 0, thirst: 45, hp: 3, weight: 0.5, desc: 'น้ำดื่มบริสุทธิ์ แก้กระหายได้ดี' },
  dirty_water: { name: 'น้ำขุ่น', type: 'consumable', hunger: 0, thirst: 25, hp: -5, inf: 12, weight: 0.5, desc: 'เสี่ยงต่อการติดเชื้อ ควรต้มก่อนดื่ม' },

  // Medical

// 2. AUDIO ENGINE (WEB AUDIO SYNTHESIS)
// ==========================================
const AudioSys = {
  ctx: null,
  muted: false,
  volume: 0.45,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  play(type) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    const v = this.volume;

    if (type === 'step') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(95 + Math.random()*25, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.06);
      gain.gain.setValueAtTime(v * 0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      osc.start(t); osc.stop(t + 0.06);
    } else if (type === 'melee') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, t);
      osc.frequency.exponentialRampToValueAtTime(65, t + 0.14);
      gain.gain.setValueAtTime(v * 0.35, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      osc.start(t); osc.stop(t + 0.14);
    } else if (type === 'gun') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(480, t);
      osc.frequency.exponentialRampToValueAtTime(55, t + 0.18);
      gain.gain.setValueAtTime(v * 0.55, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      osc.start(t); osc.stop(t + 0.18);
    } else if (type === 'loot') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, t);
      osc.frequency.setValueAtTime(740, t + 0.07);
      gain.gain.setValueAtTime(v * 0.28, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      osc.start(t); osc.stop(t + 0.16);
    } else if (type === 'zombie') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(115, t);
      osc.frequency.linearRampToValueAtTime(72, t + 0.35);
      gain.gain.setValueAtTime(v * 0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.start(t); osc.stop(t + 0.35);
    } else if (type === 'ui') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(620, t);
      gain.gain.setValueAtTime(v * 0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      osc.start(t); osc.stop(t + 0.05);
    }
  }
};

// 4. PROCEDURAL ZONE GENERATOR (7 DISTINCT ZONES)
// ==========================================
function seededRandom(seed) {
  let s = 0;
  for (let i = 0; i < seed.length; i++) s = ((s << 5) - s) + seed.charCodeAt(i);
  return function() {
    s = Math.sin(s) * 10000;
    return s - Math.floor(s);
  };
}

function generateZone(zoneId) {
  const zInfo = ZONES[zoneId];
  const rand = seededRandom(zoneId + '_v1');
  const map = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(0));
  const solids = [];
  const lootNodes = [];
  const zombies = [];
  const npcs = [];

  // Tile IDs: 0=grass/dirt, 1=asphalt road, 2=concrete floor, 3=water, 4=wood floor, 5=hospital tile
  const baseTile = zoneId === 'forest' ? 0 : (zoneId === 'supermarket' || zoneId === 'hospital' ? 2 : 0);
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      map[y][x] = baseTile;
    }
  }

  // Perimeter walls
  solids.push({ x: 0, y: 0, w: MAP_W * TILE, h: TILE, type: 'wall', color: '#1e242b' });
  solids.push({ x: 0, y: (MAP_H - 1) * TILE, w: MAP_W * TILE, h: TILE, type: 'wall', color: '#1e242b' });
  solids.push({ x: 0, y: 0, w: TILE, h: MAP_H * TILE, type: 'wall', color: '#1e242b' });
  solids.push({ x: (MAP_W - 1) * TILE, y: 0, w: TILE, h: MAP_H * TILE, type: 'wall', color: '#1e242b' });

  const addBuilding = (bx, by, bw, bh, floorType, wallColor, label, lootPool) => {
    for (let y = by; y < by + bh; y++) {
      for (let x = bx; x < bx + bw; x++) {
        if (map[y] && map[y][x] !== undefined) map[y][x] = floorType;
      }
    }
    const px = bx * TILE, py = by * TILE, pw = bw * TILE, ph = bh * TILE;
    const t = 14;
    const doorX = px + Math.floor(pw / 2) - 24;
    // Top wall
    solids.push({ x: px, y: py, w: pw, h: t, type: 'building_wall', color: wallColor, label });

    solids.push({ x: px, y: py, w: t, h: ph, type: 'building_wall', color: wallColor });
    solids.push({ x: px + pw - t, y: py, w: t, h: ph, type: 'building_wall', color: wallColor });
    // Bottom wall with doorway gap

    for (let y = 4; y < MAP_H - 4; y++) for (let x = 4; x < MAP_W - 4; x++) map[y][x] = 5;

    // River

      for (let x = rx; x < rx + 4; x++) if (map[y][x] !== undefined) map[y][x] = 3;

    addBuilding(30, 8, 18, 16, 2, '#3f3f46', 'โกดังเก็บเหล็ก', ['scrap_metal', 'scrap_metal', 'wood', 'fire_axe']);

    for (let y = 2; y < MAP_H - 2; y++) for (let x = 2; x < MAP_W - 2; x++) map[y][x] = 2;

    addBuilding(30, 6, 18, 15, 2, '#3f6212', 'คลังแสง', ['rifle', 'shotgun', 'ammo_556', 'ammo_shell']);

    });
  } else if (zoneId === 'camp') {
    for (let y = 6; y < MAP_H - 6; y++) for (let x = 6; x < MAP_W - 6; x++) map[y][x] = 4;
    addBuilding(10, 10, 14, 12, 4, '#78350f', 'โรงอาหารค่าย', ['canned_food', 'clean_water']);
    addBuilding(30, 10, 14, 12, 4, '#78350f', 'คลังกลางค่าย', ['wood', 'cloth', 'bandage']);
    // Friendly NPCs
    npcs.push(
      { id: 'npc_1', name: 'สารวัตรเอก', role: 'เฝ้าระวังพื้นที่', x: 24 * TILE, y: 24 * TILE, skill: 'ต่อสู้ +25%', recruited: false, cost: { canned_food: 2 } },
      { id: 'npc_2', name: 'หมอแพรว', role: 'ดูแลฐาน', x: 28 * TILE, y: 22 * TILE, skill: 'รักษา +30%', recruited: false, cost: { medkit: 1 } },
      { id: 'npc_3', name: 'ช่างบอย', role: 'ผลิตสิ่งของ', x: 22 * TILE, y: 28 * TILE, skill: 'คราฟต์ +25%', recruited: false, cost: { scrap_metal: 3 } },
      { id: 'npc_4', name: 'ป้าศรี', role: 'ทำอาหาร', x: 18 * TILE, y: 22 * TILE, skill: 'เสบียง +30%', recruited: false, cost: { clean_water: 2 } }
    );
  }

  // Spawn Zombies
  const zTypes = zoneId === 'military' ? ['runner', 'tank', 'screamer', 'special'] :
                 zoneId === 'hospital' ? ['walker', 'runner', 'screamer', 'special'] :
                 zoneId === 'industrial' ? ['walker', 'tank', 'runner'] :
                 ['walker', 'walker', 'runner', 'screamer'];

  for (let i = 0; i < zInfo.zombieCount; i++) {
    let zx, zy, valid = false, tries = 0;
    while (!valid && tries < 30) {
      tries++;
      zx = (4 + rand() * (MAP_W - 8)) * TILE;
      zy = (4 + rand() * (MAP_H - 8)) * TILE;
      if (Math.hypot(zx - 420, zy - 420) < 220) continue; // Safe spawn buffer
      if (!checkRectCollision(zx - 12, zy - 12, 24, 24, solids)) valid = true;
    }
    if (!valid) continue;
    const type = zTypes[Math.floor(rand() * zTypes.length)];
    const stats = getZombieStats(type);
    zombies.push({
      id: `${zoneId}_z_${i}`,
      type,
      x: zx, y: zy, homeX: zx, homeY: zy,
      vx: 0, vy: 0, angle: rand() * Math.PI * 2,
      hp: stats.hp, maxHp: stats.hp,
      speed: stats.speed, dmg: stats.dmg, sight: stats.sight,
      state: 'wandering', // idle, wandering, suspicious, chasing, attacking, searching, returning
      targetX: zx, targetY: zy,
      stateTimer: 1 + rand() * 3,
      atkCooldown: 0,
      animTime: rand() * 5,
      dead: false, deadTimer: 0
    });
  }

  return { map, solids, lootNodes, zombies, npcs };
}

function getZombieStats(type) {
  switch (type) {
    case 'runner': return { hp: 65, speed: 122, dmg: 12, sight: 240, color: '#ea580c', size: 13 };
    case 'tank': return { hp: 240, speed: 54, dmg: 28, sight: 190, color: '#7f1d1d', size: 19 };
    case 'screamer': return { hp: 70, speed: 85, dmg: 10, sight: 260, color: '#a855f7', size: 13 };
    case 'special': return { hp: 160, speed: 108, dmg: 22, sight: 280, color: '#10b981', size: 15 };
    default: return { hp: 90, speed: 72, dmg: 14, sight: 200, color: '#4d7c0f', size: 14 }; // walker
  }
}

// ==========================================
// 5. COLLISION & WORLD MANAGEMENT
// ==========================================
function checkRectCollision(x, y, w, h, solidsList) {
  for (let i = 0; i < solidsList.length; i++) {
    const s = solidsList[i];
    if (x < s.x + s.w && x + w > s.x && y < s.y + s.h && y + h > s.y) return true;
  }
  return false;
}

function getAllSolids() {
  const bList = Game.world.buildings[Game.world.currentZone] || [];
  const bSolids = bList.filter(b => b.solid && !b.open).map(b => ({ x: b.x, y: b.y, w: TILE, h: TILE }));
  return Game.solids.concat(bSolids);
}

function loadZone(zoneId, spawnSide = null) {
  if (!Game.world.unlockedZones[zoneId]) {
    toast(`พื้นที่ ${ZONES[zoneId].thName} ยังไม่ปลดล็อก! (${ZONES[zoneId].unlockReq})`);
    return;
  }
  Game.world.currentZone = zoneId;
  if (!Game.world.zoneData[zoneId]) {
    Game.world.zoneData[zoneId] = generateZone(zoneId);
  }
  const zd = Game.world.zoneData[zoneId];
  Game.map = zd.map;
  Game.solids = zd.solids;
  Game.lootNodes = zd.lootNodes;
  Game.zombies = zd.zombies;
  Game.npcs = zd.npcs;
  Game.particles = [];
  Game.projectiles = [];
  Game.action = null;

  // Position player safely based on entry direction
  if (spawnSide === 'E') { Game.player.x = (MAP_W - 3) * TILE; Game.player.y = (MAP_H / 2) * TILE; }
  else if (spawnSide === 'W') { Game.player.x = 3 * TILE; Game.player.y = (MAP_H / 2) * TILE; }
  else if (spawnSide === 'N') { Game.player.x = (MAP_W / 2) * TILE; Game.player.y = 3 * TILE; }
  else if (spawnSide === 'S') { Game.player.x = (MAP_W / 2) * TILE; Game.player.y = (MAP_H - 3) * TILE; }
  else { Game.player.x = 27 * TILE; Game.player.y = 27 * TILE; }

  // Quest checks for visiting zones
  if (zoneId === 'supermarket') advanceQuest('q_main_1', 1, true);
  if (zoneId === 'camp') toast('เข้าสู่เขตปลอดภัย: ค่ายผู้รอดชีวิต');

  document.getElementById('hud-zone').textContent = `${ZONES[zoneId].code}: ${ZONES[zoneId].name}`;
  SaveSys.autoSave();
}

// ==========================================
// 6. INVENTORY, CRAFTING & QUEST LOGIC
// ==========================================
const Inv = {
  getCount(itemId) {
    return Game.player.inventory.filter(s => s.id === itemId).reduce((acc, s) => acc + s.qty, 0);
  },
  getTotalWeight() {
    return Game.player.inventory.reduce((acc, s) => acc + (ITEMS[s.id].weight * s.qty), 0);
  },
  add(itemId, qty = 1) {
    const def = ITEMS[itemId];
    if (!def) return false;
    const stackable = def.type !== 'weapon' && def.type !== 'tool';
    if (stackable) {
      const existing = Game.player.inventory.find(s => s.id === itemId);
      if (existing) { existing.qty += qty; return true; }
    }
    if (Game.player.inventory.length >= 24) {
      toast('กระเป๋าเต็ม! ไม่สามารถเก็บ ' + def.name);
      return false;
    }
    const entry = { id: itemId, qty };
    if (def.maxDur) entry.dur = def.maxDur;
    Game.player.inventory.push(entry);

    // Quest hooks
    if (itemId === 'wood') advanceQuest('q_side_wood', qty);
    if (itemId === 'research_note') advanceQuest('q_main_2', 1);
    if (itemId === 'military_chip') advanceQuest('q_main_3', 1);
    return true;
  },
  remove(itemId, qty = 1) {
    let rem = qty;
    for (let i = Game.player.inventory.length - 1; i >= 0 && rem > 0; i--) {
      const slot = Game.player.inventory[i];
      if (slot.id === itemId) {
        const take = Math.min(slot.qty, rem);
        slot.qty -= take;
        rem -= take;
        if (slot.qty <= 0) Game.player.inventory.splice(i, 1);
      }
    }
    return rem === 0;
  },
  useSlot(idx) {
    const slot = Game.player.inventory[idx];
    if (!slot) return;
    const def = ITEMS[slot.id];
    if (def.type === 'consumable') {
      const p = Game.player;
      if (def.hp) p.hp = Math.min(p.maxHp, Math.max(0, p.hp + def.hp));
      if (def.hunger) p.hunger = Math.min(100, Math.max(0, p.hunger + def.hunger));
      if (def.thirst) p.thirst = Math.min(100, Math.max(0, p.thirst + def.thirst));
      if (def.inf) p.infection = Math.min(100, Math.max(0, p.infection + def.inf));
      slot.qty--;
      if (slot.qty <= 0) Game.player.inventory.splice(idx, 1);
      AudioSys.play('loot');
      toast(`ใช้ ${def.name} สำเร็จ`);
    } else if (def.type === 'tool' && slot.id === 'flashlight') {
      Game.player.flashlightOn = !Game.player.flashlightOn;
      toast(Game.player.flashlightOn ? 'เปิดไฟฉาย' : 'ปิดไฟฉาย');
    } else if (def.type === 'weapon') {
      Game.player.selectedSlot = idx;
      toast(`ติดตั้ง ${def.name}`);
    }
  }
};

function gainXp(amount) {
  const p = Game.player;
  p.xp += amount;
  const req = p.level * 100;
  if (p.xp >= req) {
    p.xp -= req;
    p.level++;
    p.maxHp += 10;
    p.hp = p.maxHp;
    toast(`เลเวลอัป! LV.${p.level} (พลังชีวิตสูงสุด +10)`);
    if (p.level >= 2) {
      Game.world.unlockedZones.hospital = true;
      Game.world.unlockedZones.industrial = true;
    }
    if (p.level >= 4) Game.world.unlockedZones.military = true;
  }
}

function advanceQuest(qId, amount = 1, setMin = false) {
  const q = Game.world.quests.find(x => x.id === qId);
  if (!q || q.completed) return;
  if (setMin) q.progress = Math.max(q.progress, amount);
  else q.progress += amount;

  if (q.progress >= q.target) {
    q.progress = q.target;
    q.completed = true;
    gainXp(q.rewardXp);
    for (const [k, v] of Object.entries(q.rewardItems || {})) Inv.add(k, v);
    if (q.unlockZone) Game.world.unlockedZones[q.unlockZone] = true;
    toast(`ภารกิจสำเร็จ: ${q.title} (+${q.rewardXp} XP)`);
    if (q.nextStory) {
      showStory(q.title, q.nextStory);
    }
    const nextQ = Game.world.quests.find(x => !x.completed);
    if (nextQ) Game.world.activeQuestId = nextQ.id;
  }
  updateQuestTracker();
}

function updateQuestTracker() {
  const q = Game.world.quests.find(x => x.id === Game.world.activeQuestId) || Game.world.quests[0];
  document.getElementById('qt-title').textContent = `[${q.type}] ${q.title}`;
  document.getElementById('qt-desc').textContent = q.completed ? 'สำเร็จแล้ว!' : `${q.desc} (${q.progress}/${q.target})`;
}

// ==========================================
// 7. PLAYER UPDATE, COMBAT, STEALTH & AI
// ==========================================
function emitNoise(x, y, radius) {
  Game.noises.push({ x, y, r: radius, ttl: 0.45 });
  for (const z of Game.zombies) {
    if (z.dead) continue;
    const d = Math.hypot(z.x - x, z.y - y);
    if (d <= radius) {
      z.targetX = x;
      z.targetY = y;
      if (z.state === 'idle' || z.state === 'wandering' || z.state === 'returning') {
        z.state = 'suspicious';
        z.stateTimer = 4;
      }
    }
  }
}

function performAttack() {
  const p = Game.player;
  if (p.atkCooldown > 0 || p.reloadTimer > 0 || p.inVehicle) return;
  const eq = p.inventory[p.selectedSlot];
  const weapon = (eq && ITEMS[eq.id].type === 'weapon') ? ITEMS[eq.id] : { id: 'fist', sub: 'melee', dmg: 12, range: 40, rate: 0.4, noise: 45 };

  if (weapon.sub === 'ranged') {
    const wId = eq.id;
    if ((p.loadedAmmo[wId] || 0) <= 0) {
      reloadWeapon();
      return;
    }
    p.loadedAmmo[wId]--;
    p.atkCooldown = weapon.rate;
    AudioSys.play('gun');
    emitNoise(p.x, p.y, weapon.noise);
    Game.projectiles.push({
      x: p.x + Math.cos(p.angle) * 16,
      y: p.y + Math.sin(p.angle) * 16,
      vx: Math.cos(p.angle) * 680,
      vy: Math.sin(p.angle) * 680,
      dmg: weapon.dmg,
      life: weapon.range / 680
    });
    spawnParticles(p.x + Math.cos(p.angle)*18, p.y + Math.sin(p.angle)*18, '#fde047', 5);
  } else {
    // Melee swing
    if (p.stamina < 8) { toast('พลังงานไม่พอ!'); return; }
    p.stamina -= 8;
    p.atkCooldown = weapon.rate;
    p.swingTimer = 0.18;
    AudioSys.play('melee');
    emitNoise(p.x, p.y, weapon.noise);

    let hitAny = false;
    for (const z of Game.zombies) {
      if (z.dead) continue;
      const dx = z.x - p.x, dy = z.y - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist <= weapon.range + 14) {
        const angDiff = Math.abs(Math.atan2(Math.sin(Math.atan2(dy, dx) - p.angle), Math.cos(Math.atan2(dy, dx) - p.angle)));
        if (angDiff < 1.15) {
          damageZombie(z, weapon.dmg);
          z.x += Math.cos(p.angle) * 14;
          z.y += Math.sin(p.angle) * 14;
          hitAny = true;
        }
      }
    }
    if (hitAny && eq && eq.dur) {
      eq.dur--;
      if (eq.dur <= 0) {
        toast(`${weapon.name} พังเสียหาย!`);
        p.inventory.splice(p.selectedSlot, 1);
      }
    }
  }
}

function reloadWeapon() {
  const p = Game.player;
  const eq = p.inventory[p.selectedSlot];
  if (!eq || ITEMS[eq.id].sub !== 'ranged' || p.reloadTimer > 0) return;
  const def = ITEMS[eq.id];
  const cur = p.loadedAmmo[eq.id] || 0;
  const need = def.mag - cur;
  if (need <= 0) return;
  const avail = Inv.getCount(def.ammoType);
  if (avail <= 0) { toast('ไม่มีกระสุนสำรอง!'); return; }
  const load = Math.min(need, avail);
  Inv.remove(def.ammoType, load);
  p.loadedAmmo[eq.id] = cur + load;
  p.reloadTimer = 1.1;
  AudioSys.play('ui');
  toast(`รีโหลด ${def.name} (+${load})`);
}

function damageZombie(z, dmg) {
  z.hp -= dmg;
  z.state = 'chasing';
  spawnParticles(z.x, z.y, '#dc2626', 8);
  if (z.hp <= 0) {
    z.dead = true;
    z.deadTimer = 12;
    gainXp(z.type === 'tank' ? 45 : (z.type === 'special' ? 40 : 18));
    AudioSys.play('zombie');
    // Chance drop cloth or scrap
    if (Math.random() < 0.35) {
      Game.lootNodes.push({
        id: 'zdrop_' + Date.now() + Math.random(),
        x: z.x - 10, y: z.y - 10, w: 20, h: 20,
        name: 'ซากซอมบี้', opened: false,
        pool: ['cloth', 'scrap_metal', 'ammo_9mm', 'dirty_water']
      });
    }
  }
}

function spawnParticles(x, y, color, count) {
  if (Game.settings.quality === 'low') count = Math.ceil(count / 2);
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 30 + Math.random() * 90;
    Game.particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, color, life: 0.25 + Math.random()*0.25 });
  }
}

function triggerInteract() {
  const p = Game.player;
  if (Game.action) return;

  // 1. Check Zone Exits
  const zExits = ZONES[Game.world.currentZone].exits;
  for (const ex of zExits) {
    let exX = (MAP_W / 2) * TILE, exY = (MAP_H / 2) * TILE;
    if (ex.dir === 'E') exX = (MAP_W - 2) * TILE;
    if (ex.dir === 'W') exX = 2 * TILE;
    if (ex.dir === 'N') exY = 2 * TILE;
    if (ex.dir === 'S') exY = (MAP_H - 2) * TILE;
    if (Math.hypot(p.x - exX, p.y - exY) < 68) {
      const opp = { E: 'W', W: 'E', N: 'S', S: 'N' }[ex.dir];
      loadZone(ex.to, opp);
      return;
    }
  }

  // 2. Check Vehicle Enter/Exit
  const v = Game.world.vehicle;
  if (p.inVehicle) {
    p.inVehicle = false;
    p.x = v.x + 36;
    toast('ลงจากรถกระบะ');
    return;
  } else if (v.zone === Game.world.currentZone && Math.hypot(p.x - v.x, p.y - v.y) < 56) {
    if (v.fuel <= 0) {
      if (Inv.remove('fuel', 1)) { v.fuel = 100; toast('เติมน้ำมันรถกระบะเรียบร้อย!'); }
      else { toast('รถน้ำมันหมด! ต้องใช้ถังน้ำมันเชื้อเพลิง'); return; }
    }
    p.inVehicle = true;
    toast('ขึ้นขับรถกระบะ (กด E เพื่อลง)');
    return;
  }

  // 3. Check Player Built Interactables (Doors, Beds, Campfire, Water, Workbench)
  const bList = Game.world.buildings[Game.world.currentZone] || [];
  for (const b of bList) {
    if (Math.hypot(p.x - (b.x + 16), p.y - (b.y + 16)) < 50) {
      const def = BUILDINGS[b.type];
      if (def.isDoor) {
        b.open = !b.open;
        AudioSys.play('ui');
        return;
      }
      if (def.interact === 'sleep') {
        Game.action = { type: 'sleep', progress: 0, duration: 1.5, label: 'กำลังนอนพักผ่อน...' };
        return;
      }
      if (def.interact === 'craft' || def.interact === 'cook') {
        UI.openModal('crafting');
        return;
      }
      if (def.interact === 'water') {
        Inv.add('clean_water', 1);
        AudioSys.play('loot');
        toast('เก็บน้ำดื่มสะอาดจากถังเก็บน้ำฝน +1');
        return;
      }
      if (def.interact === 'farm') {
        Inv.add('berry', 2);
        AudioSys.play('loot');
        toast('เก็บผลผลิตจากแปลงปลูกพืช +2');
        return;
      }
    }
  }

  // 4. Check Camp NPCs
  for (const npc of Game.npcs) {
    if (Math.hypot(p.x - npc.x, p.y - npc.y) < 52) {
      UI.openModal('survivors');
      return;
    }
  }

  // 5. Check Loot Containers
  for (const node of Game.lootNodes) {
    if (!node.opened && Math.hypot(p.x - (node.x + node.w/2), p.y - (node.y + node.h/2)) < 52) {
      Game.action = { type: 'loot', target: node, progress: 0, duration: 0.9, label: `กำลังค้นหา ${node.name}...` };
      return;
    }
  }

  toast('ไม่มีวัตถุให้โต้ตอบในระยะใกล้');
}

function updateSimulation(dt) {
  if (Game.state !== 'PLAYING') return;
  const p = Game.player;
  const w = Game.world;

  // 1. World Time & Weather
  w.timeMinutes += dt * 4.5; // 1 game hour = ~13.3 sec
  if (w.timeMinutes >= 1440) {
    w.timeMinutes -= 1440;
    w.day++;
    toast(`เริ่มต้นวันที่ ${w.day}`);
  }
  w.weatherTimer -= dt;
  if (w.weatherTimer <= 0) {
    const weathers = ['clear', 'clear', 'cloudy', 'rain', 'fog'];
    w.weather = weathers[Math.floor(Math.random() * weathers.length)];
    w.weatherTimer = 60 + Math.random() * 90;
  }

  // 2. Survival Needs & Passive Survivor Production
  const survBonus = w.survivors.length * 0.15;
  p.hunger = Math.max(0, p.hunger - dt * 0.22);
  p.thirst = Math.max(0, p.thirst - dt * 0.30);
  if (p.hunger <= 0 || p.thirst <= 0) p.hp = Math.max(0, p.hp - dt * 2.2);
  if (p.infection > 0) {
    p.infection = Math.min(100, p.infection + dt * 0.15);
    if (p.infection >= 100) p.hp = Math.max(0, p.hp - dt * 4.0);
  }
  if (p.hunger > 65 && p.thirst > 65 && p.infection < 20 && p.hp < p.maxHp) {
    p.hp = Math.min(p.maxHp, p.hp + dt * (0.6 + survBonus));
  }
  if (p.hp <= 0) {
    Game.state = 'PAUSED';
    showStory('คุณเสียชีวิตแล้ว', `คุณเอาชีวิตรอดได้ทั้งหมด ${w.day} วัน (เลเวล ${p.level}) โลกหลังวันสิ้นโลกยังคงโหดร้ายเสมอ...`, () => {
      location.reload();
    });
    return;
  }

  // 3. Action Progress (Looting / Sleeping)
  if (Game.action) {
    Game.action.progress += dt;
    const pct = Math.min(100, (Game.action.progress / Game.action.duration) * 100);
    document.getElementById('action-bar-wrap').classList.remove('hidden');
    document.getElementById('action-label').textContent = Game.action.label;
    document.getElementById('action-fill').style.width = pct + '%';

    if (Game.action.progress >= Game.action.duration) {
      if (Game.action.type === 'loot') {
        const node = Game.action.target;
        node.opened = true;
        AudioSys.play('loot');
        const foundNames = [];
        if (node.guaranteed) {
          Inv.add(node.guaranteed, 1);
          foundNames.push(ITEMS[node.guaranteed].name);
        }
        const drops = 1 + Math.floor(Math.random() * 2);
        for (let i = 0; i < drops; i++) {
          const pick = node.pool[Math.floor(Math.random() * node.pool.length)];
          const qty = pick.startsWith('ammo_') ? 5 : 1;
          if (Inv.add(pick, qty)) foundNames.push(`${ITEMS[pick].name} x${qty}`);
        }
        gainXp(10);
        if (w.currentZone === 'town') advanceQuest('q_main_1', 1);
        toast(`พบ: ${foundNames.join(', ')}`);
      } else if (Game.action.type === 'sleep') {
        p.stamina = 100;
        p.hp = Math.min(p.maxHp, p.hp + 35);
        w.timeMinutes = (w.timeMinutes + 360) % 1440;
        toast('พักผ่อนเรียบร้อย พลังงานเต็ม 100%');
        SaveSys.autoSave();
      }
      Game.action = null;
      document.getElementById('action-bar-wrap').classList.add('hidden');
    }
  } else {
    document.getElementById('action-bar-wrap').classList.add('hidden');
  }

  // 4. Player Movement & Vehicle Driving
  let ix = 0, iy = 0;
  if (Game.keys['KeyW'] || Game.keys['ArrowUp']) iy -= 1;
  if (Game.keys['KeyS'] || Game.keys['ArrowDown']) iy += 1;
  if (Game.keys['KeyA'] || Game.keys['ArrowLeft']) ix -= 1;
  if (Game.keys['KeyD'] || Game.keys['ArrowRight']) ix += 1;
  if (Game.joy.active) { ix = Game.joy.dx; iy = Game.joy.dy; }

  const mag = Math.hypot(ix, iy);
  if (mag > 1) { ix /= mag; iy /= mag; }

  const isSprint = (Game.keys['ShiftLeft'] || Game.keys['ShiftRight'] || Game.mobileSprint) && p.stamina > 5 && mag > 0.1;
  const isSneak = (Game.keys['ControlLeft'] || Game.keys['KeyC'] || Game.mobileSneak) && !isSprint;

  let curSpeed = p.speed;
  if (p.inVehicle) {
    curSpeed = w.vehicle.fuel > 0 ? 275 : 40;
    if (mag > 0.1) w.vehicle.fuel = Math.max(0, w.vehicle.fuel - dt * 1.4);
  } else if (isSprint) {
    curSpeed *= 1.55;
    p.stamina = Math.max(0, p.stamina - dt * 18);
    p.state = 'run';
    p.noiseRadius = 175;
  } else if (isSneak) {
    curSpeed *= 0.55;
    p.stamina = Math.min(100, p.stamina + dt * 10);
    p.state = 'sneak';
    p.noiseRadius = 25;
  } else {
    p.stamina = Math.min(100, p.stamina + dt * 12);
    p.state = mag > 0.1 ? 'walk' : 'idle';
    p.noiseRadius = mag > 0.1 ? 85 : 15;
  }

  if (mag > 0.1) {
    if (Game.action) Game.action = null; // Cancel loot if moving
    const solidsList = getAllSolids();
    const box = p.inVehicle ? 22 : 11;
    const nx = p.x + ix * curSpeed * dt;
    const ny = p.y + iy * curSpeed * dt;
    if (!checkRectCollision(nx - box, p.y - box, box * 2, box * 2, solidsList)) p.x = nx;
    if (!checkRectCollision(p.x - box, ny - box, box * 2, box * 2, solidsList)) p.y = ny;

    if (p.inVehicle) {
      w.vehicle.x = p.x; w.vehicle.y = p.y; w.vehicle.zone = w.currentZone;
      emitNoise(p.x, p.y, 260);
    }

    if (Math.abs(ix) > Math.abs(iy)) p.dir = ix > 0 ? 'right' : 'left';
    else p.dir = iy > 0 ? 'down' : 'up';

    if (!Game.mouse.down && !Game.joy.active) p.angle = Math.atan2(iy, ix);
    else if (Game.joy.active) p.angle = Math.atan2(iy, ix);

    p.animTime += dt * (isSprint ? 12 : 8);
    p.stepTimer -= dt;
    if (p.stepTimer <= 0 && !p.inVehicle) {
      p.stepTimer = isSprint ? 0.26 : (isSneak ? 0.55 : 0.38);
      if (!isSneak) AudioSys.play('step');
      if (p.noiseRadius > 50) emitNoise(p.x, p.y, p.noiseRadius);
    }
  }

  // Cooldowns & Attack
  if (p.atkCooldown > 0) p.atkCooldown -= dt;
  if (p.swingTimer > 0) p.swingTimer -= dt;
  if (p.reloadTimer > 0) p.reloadTimer -= dt;
  if (Game.mouse.down && !Game.buildMode.active) performAttack();

  // Camera smooth follow
  Game.cam.x += (p.x - Game.width / 2 - Game.cam.x) * Math.min(1, dt * 8);
  Game.cam.y += (p.y - Game.height / 2 - Game.cam.y) * Math.min(1, dt * 8);

  // 5. Projectiles & Particles
  for (let i = Game.projectiles.length - 1; i >= 0; i--) {
    const pr = Game.projectiles[i];
    pr.x += pr.vx * dt;
    pr.y += pr.vy * dt;
    pr.life -= dt;
    let hit = false;
    for (const z of Game.zombies) {
      if (!z.dead && Math.hypot(z.x - pr.x, z.y - pr.y) < 18) {
        damageZombie(z, pr.dmg);
        hit = true;
        break;
      }
    }
    if (hit || pr.life <= 0 || checkRectCollision(pr.x - 2, pr.y - 2, 4, 4, Game.solids)) {
      Game.projectiles.splice(i, 1);
    }
  }

  for (let i = Game.particles.length - 1; i >= 0; i--) {
    const pt = Game.particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.life <= 0) Game.particles.splice(i, 1);
  }
  for (let i = Game.noises.length - 1; i >= 0; i--) {
    Game.noises[i].ttl -= dt;
    if (Game.noises[i].ttl <= 0) Game.noises.splice(i, 1);
  }

  // 6. Zombie AI State Machine (7 States + Camera Culling Optimization)
  const hour = Math.floor(w.timeMinutes / 60);
  const isNight = hour >= 19 || hour < 5;
  const stealthMult = (isSneak ? 0.55 : 1.0) * (isNight && !p.flashlightOn ? 0.65 : 1.0);
  let detectedCount = 0;

  for (const z of Game.zombies) {
    if (z.dead) {
      z.deadTimer -= dt;
      continue;
    }
    const distToPlayer = Math.hypot(p.x - z.x, p.y - z.y);
    if (distToPlayer > 950) continue; // Performance culling for distant zombies

    if (z.atkCooldown > 0) z.atkCooldown -= dt;
    z.animTime += dt * 6;
    const effectiveSight = z.sight * stealthMult;

    // Vision check
    if (distToPlayer <= effectiveSight) {
      z.state = 'chasing';
      z.targetX = p.x;
      z.targetY = p.y;
      z.stateTimer = 5;
    }

    if (z.state === 'chasing') detectedCount++;

    let moveX = 0, moveY = 0, spd = z.speed;
    if (z.state === 'idle') {
      spd = 0;
      z.stateTimer -= dt;
      if (z.stateTimer <= 0) {
        z.state = 'wandering';
        z.targetX = z.homeX + (Math.random() - 0.5) * 180;
        z.targetY = z.homeY + (Math.random() - 0.5) * 180;
        z.stateTimer = 3 + Math.random() * 3;
      }
    } else if (z.state === 'wandering') {
      spd = z.speed * 0.45;
      const d = Math.hypot(z.targetX - z.x, z.targetY - z.y);
      if (d < 12 || z.stateTimer <= 0) {
        z.state = 'idle';
        z.stateTimer = 1.5 + Math.random() * 2.5;
      } else {
        moveX = (z.targetX - z.x) / d;
        moveY = (z.targetY - z.y) / d;
        z.stateTimer -= dt;
      }
    } else if (z.state === 'suspicious' || z.state === 'searching') {
      spd = z.speed * 0.7;
      const d = Math.hypot(z.targetX - z.x, z.targetY - z.y);
      if (d < 16) {
        z.state = 'searching';
        z.angle += dt * 3;
        z.stateTimer -= dt;
        if (z.stateTimer <= 0) z.state = 'returning';
      } else {
        moveX = (z.targetX - z.x) / d;
        moveY = (z.targetY - z.y) / d;
      }
    } else if (z.state === 'chasing') {
      if (distToPlayer <= 28) {
        z.state = 'attacking';
      } else if (distToPlayer > effectiveSight * 1.45) {
        z.state = 'searching';
        z.stateTimer = 3.5;
      } else {
        moveX = (p.x - z.x) / distToPlayer;
        moveY = (p.y - z.y) / distToPlayer;
        if (z.type === 'screamer' && Math.random() < dt * 0.4) {
          AudioSys.play('zombie');
          emitNoise(z.x, z.y, 340);
        }
      }
    } else if (z.state === 'attacking') {
      if (distToPlayer > 34) {
        z.state = 'chasing';
      } else if (z.atkCooldown <= 0) {
        z.atkCooldown = 1.1;
        if (p.inVehicle) {
          w.vehicle.hp = Math.max(0, w.vehicle.hp - z.dmg * 0.5);
          if (w.vehicle.hp <= 0) { p.inVehicle = false; toast('รถพังเสียหายหนัก!'); }
        } else {
          p.hp = Math.max(0, p.hp - z.dmg);
          p.infection = Math.min(100, p.infection + 4);
          spawnParticles(p.x, p.y, '#ef4444', 6);
        }
      }
    } else if (z.state === 'returning') {
      spd = z.speed * 0.5;
      const d = Math.hypot(z.homeX - z.x, z.homeY - z.y);
      if (d < 20) z.state = 'idle';
      else { moveX = (z.homeX - z.x) / d; moveY = (z.homeY - z.y) / d; }
    }

    if (spd > 0 && (moveX !== 0 || moveY !== 0)) {
      z.angle = Math.atan2(moveY, moveX);
      const solidsList = getAllSolids();
      const nx = z.x + moveX * spd * dt;
      const ny = z.y + moveY * spd * dt;
      if (!checkRectCollision(nx - 10, z.y - 10, 20, 20, solidsList)) z.x = nx;
      else if (z.state === 'chasing') {
        // Damage player buildings blocking path
        const bList = w.buildings[w.currentZone] || [];
        const hitB = bList.find(b => b.solid && Math.hypot(b.x + 16 - nx, b.y + 16 - z.y) < 34);
        if (hitB && z.atkCooldown <= 0) {
          z.atkCooldown = 1.2;
          hitB.hp -= z.dmg;
          if (hitB.hp <= 0) bList.splice(bList.indexOf(hitB), 1);
        }
      }
      if (!checkRectCollision(z.x - 10, ny - 10, 20, 20, solidsList)) z.y = ny;
    }
  }

  updateHUD(detectedCount, isSneak);
}

// ==========================================
// 8. PIXEL ART HD RENDERER (CANVAS 2D)
// ==========================================
function renderWorld() {
  const ctx = Game.ctx;
  const cw = Game.width, ch = Game.height;
  const cx = Math.floor(Game.cam.x), cy = Math.floor(Game.cam.y);

  ctx.fillStyle = '#0b0d10';
  ctx.fillRect(0, 0, cw, ch);

  ctx.save();
  ctx.translate(-cx, -cy);

  // Camera Culling bounds
  const startCol = Math.max(0, Math.floor(cx / TILE));
  const endCol = Math.min(MAP_W - 1, Math.ceil((cx + cw) / TILE));
  const startRow = Math.max(0, Math.floor(cy / TILE));
  const endRow = Math.min(MAP_H - 1, Math.ceil((cy + ch) / TILE));

  // 1. Draw Detailed Pixel Terrain Tiles
  for (let r = startRow; r <= endRow; r++) {
    for (let c = startCol; c <= endCol; c++) {
      const t = Game.map[r][c];
      const x = c * TILE, y = r * TILE;
      if (t === 0) {
        ctx.fillStyle = Game.world.currentZone === 'forest' ? '#1c3320' : '#252d26';
        ctx.fillRect(x, y, TILE, TILE);
        // Pixel grass tufts
        if ((r * 7 + c * 13) % 5 === 0) {
          ctx.fillStyle = '#2f4a33';
          ctx.fillRect(x + 6, y + 8, 4, 4);
          ctx.fillRect(x + 18, y + 20, 4, 4);
        }
      } else if (t === 1) {
        ctx.fillStyle = '#262930';
        ctx.fillRect(x, y, TILE, TILE);
        // Cracks & road lines
        if ((r + c) % 4 === 0) {
          ctx.fillStyle = '#1b1d22';
          ctx.fillRect(x + 4, y + 12, 10, 2);
        }
        if (c === 27 && r % 2 === 0) {
          ctx.fillStyle = '#ca8a04';
          ctx.fillRect(x + 14, y + 6, 4, 18);
        }
      } else if (t === 2) {
        ctx.fillStyle = '#333942';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.strokeStyle = '#282d35';
        ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
      } else if (t === 3) {
        ctx.fillStyle = '#1d4ed8';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#3b82f6';
        ctx.fillRect(x + ((r + Math.floor(Date.now()/400)) % 20), y + 10, 8, 2);
      } else if (t === 4) {
        ctx.fillStyle = '#4a3525';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#38271b';
        ctx.fillRect(x, y + 15, TILE, 2);
      } else if (t === 5) {
        ctx.fillStyle = (r + c) % 2 === 0 ? '#94a3b8' : '#7e8e9f';
        ctx.fillRect(x, y, TILE, TILE);
      }
    }
  }

  // 2. Zone Exit Markers
  for (const ex of ZONES[Game.world.currentZone].exits) {
    let exX = (MAP_W / 2) * TILE, exY = (MAP_H / 2) * TILE;
    if (ex.dir === 'E') exX = (MAP_W - 2) * TILE;
    if (ex.dir === 'W') exX = 2 * TILE;
    if (ex.dir === 'N') exY = 2 * TILE;
    if (ex.dir === 'S') exY = (MAP_H - 2) * TILE;
    ctx.fillStyle = 'rgba(234, 179, 8, 0.25)';
    ctx.fillRect(exX - 32, exY - 32, 64, 64);
    ctx.strokeStyle = '#eab308';
    ctx.strokeRect(exX - 32, exY - 32, 64, 64);
    ctx.fillStyle = '#fef08a';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ex.label, exX, exY - 38);
  }

  // 3. Player Built Structures
  const bList = Game.world.buildings[Game.world.currentZone] || [];
  for (const b of bList) {
    const def = BUILDINGS[b.type];
    ctx.fillStyle = b.open ? 'rgba(140,88,45,0.35)' : def.color;
    ctx.fillRect(b.x, b.y, TILE, TILE);
    ctx.strokeStyle = '#000';
    ctx.strokeRect(b.x, b.y, TILE, TILE);
    if (b.hp < def.hp) {
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(b.x + 2, b.y - 5, (TILE - 4) * (b.hp / def.hp), 3);
    }
  }

  // 4. Loot Containers
  for (const node of Game.lootNodes) {
    if (node.x < cx - 50 || node.x > cx + cw + 50 || node.y < cy - 50 || node.y > cy + ch + 50) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(node.x + 3, node.y + 4, node.w, node.h);
    ctx.fillStyle = node.opened ? '#475569' : '#d97706';
    ctx.fillRect(node.x, node.y, node.w, node.h);
    ctx.strokeStyle = node.opened ? '#1e293b' : '#fef08a';
    ctx.strokeRect(node.x, node.y, node.w, node.h);
  }

  // 5. Solids (Buildings, Trees, Cars, Rocks) with Shadows
  for (const s of Game.solids) {
    if (s.x + s.w < cx - 50 || s.x > cx + cw + 50 || s.y + s.h < cy - 50 || s.y > cy + ch + 50) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(s.x + 5, s.y + 6, s.w, s.h);
    ctx.fillStyle = s.color || '#334155';
    ctx.fillRect(s.x, s.y, s.w, s.h);
    if (s.type === 'car') {
      // Car windshield & headlights pixel details
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(s.x + 10, s.y + 4, 12, s.h - 8);
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(s.x + s.w - 4, s.y + 3, 4, 6);
      ctx.fillRect(s.x + s.w - 4, s.y + s.h - 9, 4, 6);
    } else if (s.type === 'tree') {
      ctx.fillStyle = '#166534';
      ctx.fillRect(s.x - 4, s.y - 6, s.w + 8, s.h + 4);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(s.x + 2, s.y - 2, 12, 10);
    }
    if (s.label) {
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(s.label, s.x + s.w / 2, s.y - 6);
    }
  }

  // 6. Vehicle (Pickup Truck)
  const v = Game.world.vehicle;
  if (v.zone === Game.world.currentZone) {
    ctx.save();
    ctx.translate(v.x, v.y);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(-26, -14, 56, 32);
    ctx.fillStyle = '#b45309';
    ctx.fillRect(-28, -16, 56, 32);
    ctx.fillStyle = '#78350f';
    ctx.fillRect(-24, -12, 24, 24); // Truck bed
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(6, -12, 10, 24); // Windshield
    ctx.restore();
  }

  // 7. Friendly NPCs
  for (const npc of Game.npcs) {
    drawHumanoid(ctx, npc.x, npc.y, '#3b82f6', '#fcd34d', 0, false);
    ctx.fillStyle = '#93c5fd';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(npc.name, npc.x, npc.y - 20);
  }

  // 8. Zombies
  for (const z of Game.zombies) {
    if (z.x < cx - 60 || z.x > cx + cw + 60 || z.y < cy - 60 || z.y > cy + ch + 60) continue;
    if (z.dead) {
      if (z.deadTimer > 0) {
        ctx.fillStyle = '#450a0a';
        ctx.fillRect(z.x - 14, z.y - 6, 28, 12);
      }
      continue;
    }
    const st = getZombieStats(z.type);
    const bob = Math.sin(z.animTime) * 2;
    drawHumanoid(ctx, z.x, z.y + bob, st.color, '#84cc16', z.angle, true, st.size);

    // Zombie HP bar & alert indicator
    if (z.hp < z.maxHp) {
      ctx.fillStyle = '#000';
      ctx.fillRect(z.x - 14, z.y - 22, 28, 4);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(z.x - 14, z.y - 22, 28 * (z.hp / z.maxHp), 4);
    }
    if (z.state === 'chasing' || z.state === 'suspicious') {
      ctx.fillStyle = z.state === 'chasing' ? '#ef4444' : '#facc15';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(z.state === 'chasing' ? '!' : '?', z.x, z.y - 26);
    }
  }

  // 9. Player Character (if not inside vehicle)
  const p = Game.player;
  if (!p.inVehicle) {
    const bob = (p.state === 'walk' || p.state === 'run') ? Math.sin(p.animTime) * 2 : 0;
    drawHumanoid(ctx, p.x, p.y + bob, p.state === 'sneak' ? '#475569' : '#0284c7', '#fde68a', p.angle, false);

    // Weapon / Melee swing visual
    if (p.swingTimer > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 34, p.angle - 0.9, p.angle + 0.9);
      ctx.stroke();
    }
  }

  // 10. Projectiles, Particles, Sound Ripples
  ctx.fillStyle = '#fef08a';
  for (const pr of Game.projectiles) ctx.fillRect(pr.x - 3, pr.y - 3, 6, 6);

  for (const pt of Game.particles) {
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
  }

  for (const n of Game.noises) {
    ctx.strokeStyle = `rgba(255, 255, 255, ${n.ttl * 0.45})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r * (1 - n.ttl), 0, Math.PI * 2);
    ctx.stroke();
  }

  // 11. Build Mode Ghost Preview
  if (Game.buildMode.active && Game.buildMode.type) {
    const gx = Math.floor(Game.mouse.worldX / TILE) * TILE;
    const gy = Math.floor(Game.mouse.worldY / TILE) * TILE;
    const canPlace = !checkRectCollision(gx + 2, gy + 2, TILE - 4, TILE - 4, getAllSolids());
    ctx.fillStyle = canPlace ? 'rgba(34, 197, 94, 0.45)' : 'rgba(239, 68, 68, 0.45)';
    ctx.fillRect(gx, gy, TILE, TILE);
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(gx, gy, TILE, TILE);
  }

  ctx.restore();

  // 12. Day/Night Lighting & Weather Overlay
  renderAtmosphere(ctx, cw, ch, p.x - cx, p.y - cy);
  renderMinimap();
}

function drawHumanoid(ctx, x, y, bodyCol, headCol, angle, isZombie, size = 14) {
  ctx.save();
  ctx.translate(x, y);
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.ellipse(0, size * 0.7, size * 0.85, size * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.rotate(angle);
  // Arms
  ctx.fillStyle = isZombie ? headCol : bodyCol;
  if (isZombie) {
    ctx.fillRect(4, -size * 0.75, size * 0.9, 5);
    ctx.fillRect(4, size * 0.75 - 5, size * 0.9, 5);
  } else {
    ctx.fillRect(2, -size * 0.7, 8, 5);
    ctx.fillRect(2, size * 0.7 - 5, 8, 5);
  }
  // Torso
  ctx.fillStyle = bodyCol;
  ctx.fillRect(-size * 0.55, -size * 0.65, size * 1.1, size * 1.3);
  // Head
  ctx.fillStyle = headCol;
  ctx.fillRect(-size * 0.35, -size * 0.4, size * 0.75, size * 0.8);
  ctx.restore();
}

function renderAtmosphere(ctx, cw, ch, px, py) {
  const hour = Math.floor(Game.world.timeMinutes / 60);
  let darkAlpha = 0;
  if (hour >= 20 || hour < 5) darkAlpha = 0.78;
  else if (hour >= 18) darkAlpha = 0.42;
  else if (hour < 7) darkAlpha = 0.35;

  if (darkAlpha > 0) {
    const grad = ctx.createRadialGradient(px, py, Game.player.flashlightOn ? 90 : 40, px, py, Game.player.flashlightOn ? 320 : 150);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, `rgba(6, 9, 15, ${darkAlpha})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cw, ch);
  }

  if (Game.world.weather === 'rain' && Game.settings.quality !== 'low') {
    ctx.strokeStyle = 'rgba(147, 197, 253, 0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < 65; i++) {
      const rx = (i * 97 + Date.now() * 0.4) % cw;
      const ry = (i * 53 + Date.now() * 0.9) % ch;
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx - 4, ry + 12);
    }
    ctx.stroke();
  } else if (Game.world.weather === 'fog') {
    ctx.fillStyle = 'rgba(203, 213, 225, 0.16)';
    ctx.fillRect(0, 0, cw, ch);
  }
}

function renderMinimap() {
  const ctx = Game.mmCtx;
  const s = 110 / MAP_W;
  ctx.fillStyle = '#090c10';
  ctx.fillRect(0, 0, 110, 110);

  for (let r = 0; r < MAP_H; r += 2) {
    for (let c = 0; c < MAP_W; c += 2) {
      const t = Game.map[r][c];
      ctx.fillStyle = t === 1 ? '#475569' : (t === 3 ? '#2563eb' : (t === 0 ? '#14532d' : '#334155'));
      ctx.fillRect(c * s, r * s, s * 2, s * 2);
    }
  }
  // Loot dots
  ctx.fillStyle = '#f59e0b';
  for (const l of Game.lootNodes) {
    if (!l.opened) ctx.fillRect((l.x / TILE) * s, (l.y / TILE) * s, 2.5, 2.5);
  }
  // Zombies
  ctx.fillStyle = '#ef4444';
  for (const z of Game.zombies) {
    if (!z.dead) ctx.fillRect((z.x / TILE) * s, (z.y / TILE) * s, 2.5, 2.5);
  }
  // Player
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect((Game.player.x / TILE) * s - 2, (Game.player.y / TILE) * s - 2, 4, 4);
}

function updateHUD(detectedCount, isSneak) {
  const p = Game.player;
  document.getElementById('hud-hp').style.width = `${(p.hp / p.maxHp) * 100}%`;
  document.getElementById('txt-hp').textContent = Math.ceil(p.hp);
  document.getElementById('hud-hunger').style.width = `${p.hunger}%`;
  document.getElementById('txt-hunger').textContent = Math.ceil(p.hunger);
  document.getElementById('hud-thirst').style.width = `${p.thirst}%`;
  document.getElementById('txt-thirst').textContent = Math.ceil(p.thirst);
  document.getElementById('hud-stamina').style.width = `${p.stamina}%`;
  document.getElementById('txt-stamina').textContent = Math.ceil(p.stamina);
  document.getElementById('hud-inf').style.width = `${p.infection}%`;
  document.getElementById('txt-inf').textContent = `${Math.floor(p.infection)}%`;
  document.getElementById('txt-lvl').textContent = `LV.${p.level} (${p.xp}/${p.level*100})`;

  const eq = p.inventory[p.selectedSlot];
  if (eq && ITEMS[eq.id].sub === 'ranged') {
    const def = ITEMS[eq.id];
    document.getElementById('txt-ammo').textContent = `กระสุน: ${p.loadedAmmo[eq.id]||0}/${Inv.getCount(def.ammoType)}`;
  } else {
    document.getElementById('txt-ammo').textContent = eq ? ITEMS[eq.id].name : 'มือเปล่า';
  }

  const h = Math.floor(Game.world.timeMinutes / 60);
  const m = Math.floor(Game.world.timeMinutes % 60);
  const period = h >= 5 && h < 11 ? 'เช้า' : (h >= 11 && h < 17 ? 'กลางวัน' : (h >= 17 && h < 20 ? 'เย็น' : 'กลางคืน'));
  document.getElementById('hud-time').textContent = `วันที่ ${Game.world.day} | ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} (${period})`;

  const wMap = { clear: 'แดดออก', cloudy: 'เมฆครึ้ม', rain: 'ฝนตก', fog: 'หมอกลง' };
  document.getElementById('hud-weather').textContent = wMap[Game.world.weather];

  const sb = document.getElementById('hud-stealth');
  if (detectedCount > 0) {
    sb.textContent = `ถูกพบตัว (${detectedCount})`;
    sb.className = 'stealth-badge stealth-danger';
  } else {
    sb.textContent = isSneak ? 'ย่องเงียบ' : 'ปลอดภัย';
    sb.className = 'stealth-badge';
  }

  renderHotbar();
}

function renderHotbar() {
  const hb = document.getElementById('hotbar');
  let html = '';
  for (let i = 0; i < 5; i++) {
    const item = Game.player.inventory[i];
    const active = Game.player.selectedSlot === i ? 'active' : '';
    if (item) {
      const def = ITEMS[item.id];
      const durPct = def.maxDur ? Math.floor((item.dur / def.maxDur) * 100) : 0;
      html += `<div class="hotbar-slot ${active}" onclick="selectHotbar(${i})">
        <span class="hotbar-key">${i+1}</span>
        <span>${def.name.slice(0,7)}</span>
        ${item.qty > 1 ? `<span class="hotbar-qty">${item.qty}</span>` : ''}
        ${def.maxDur ? `<div class="hotbar-dur" style="width:${durPct}%"></div>` : ''}
      </div>`;
    } else {
      html += `<div class="hotbar-slot ${active}" onclick="selectHotbar(${i})"><span class="hotbar-key">${i+1}</span></div>`;
    }
  }
  hb.innerHTML = html;
}

window.selectHotbar = function(idx) {
  Game.player.selectedSlot = idx;
  const item = Game.player.inventory[idx];
  if (item && (ITEMS[item.id].type === 'consumable' || ITEMS[item.id].type === 'tool')) {
    Inv.useSlot(idx);
  }
};

function toast(msg) {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function showStory(title, text, onClose = null) {
  document.getElementById('story-title').textContent = title;
  document.getElementById('story-text').textContent = text;
  document.getElementById('story-screen').classList.remove('hidden');
  document.getElementById('btn-story-next').onclick = () => {
    document.getElementById('story-screen').classList.add('hidden');
    if (onClose) onClose();
  };
}

          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="SaveSys.manualSave()">บันทึกเกมทันที (SAVE)</button>
            <button class="btn" onclick="SaveSys.loadGame();UI.closeModal()">โหลดเซฟล่าสุด (LOAD)</button>
          </div>
          <hr style="border-color:#2e3746;margin:10px 0;">
          <h3>ตั้งค่ากราฟิกและเสียง</h3>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-sm" onclick="AudioSys.muted=!AudioSys.muted;toast(AudioSys.muted?'ปิดเสียง':'เปิดเสียง')">เปิด/ปิด เสียงประกอบ</button>
            <button class="btn btn-sm" onclick="Game.settings.quality='low';toast('กราฟิก: ระดับต่ำ (ลื่นไหลสูงสุด)')">กราฟิก: ต่ำ</button>
            <button class="btn btn-sm" onclick="Game.settings.quality='high';toast('กราฟิก: ระดับสูง (HD)')">กราฟิก: สูง</button>
          </div>
          <div style="margin-top:10px;font-size:12px;color:#94a3b8;">
            <strong>การควบคุม PC:</strong> WASD เดิน | Shift วิ่ง | Ctrl/C ย่อง | E โต้ตอบ/ค้นหา/ขึ้นรถ | R รีโหลด | คลิกซ้าย โจมตี
          </div>
        </div>`;
    }
  },
  sortInv() {
    Game.player.inventory.sort((a, b) => ITEMS[a.id].type.localeCompare(ITEMS[b.id].type));
    this.switchTab('inventory');
  },
  craft(recipeId) {
    const r = RECIPES.find(x => x.id === recipeId);
    if (!r) return;
    for (const [k, v] of Object.entries(r.req)) if (Inv.getCount(k) < v) return;
    for (const [k, v] of Object.entries(r.req)) Inv.remove(k, v);
    Inv.add(r.out, r.qty);
    gainXp(15);
    AudioSys.play('loot');
    toast(`คราฟต์ ${ITEMS[r.out].name} x${r.qty} สำเร็จ!`);
    this.switchTab('crafting');
  },
  startBuild(bType) {
    this.closeModal();
    Game.buildMode = { active: true, type: bType, rot: 0, gx: 0, gy: 0 };
    toast(`โหมดก่อสร้าง: คลิกบนพื้นที่ว่างเพื่อวาง ${BUILDINGS[bType].name} (กด Esc เพื่อยกเลิก)`);
  },
  recruit(npcId) {
    const campNpcs = Game.world.zoneData.camp.npcs;
    const npc = campNpcs.find(n => n.id === npcId);
    if (!npc) return;
    const [rk, rv] = Object.entries(npc.cost)[0];
    if (!Inv.remove(rk, rv)) return;
    npc.recruited = true;
    Game.world.survivors.push({ name: npc.name, role: npc.role, skill: npc.skill });
    advanceQuest('q_surv_camp', 1);
    toast(`รับสมัคร ${npc.name} เข้าสู่กลุ่มผู้รอดชีวิต!`);
    this.switchTab('survivors');
  }
};

// ==========================================
// 10. SAVE & LOAD SYSTEM (LOCALSTORAGE)
// ==========================================
const SAVE_KEY = 'zals_save_v1';
const SaveSys = {
  hasSave() {
    return !!localStorage.getItem(SAVE_KEY);
  },
  manualSave() {
    this.autoSave();
    toast('บันทึกความคืบหน้าเกมเรียบร้อยแล้ว');
  },
  autoSave() {
    try {
      const payload = {
        v: 1,
        world: Game.world,
        player: Game.player
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
    } catch (e) {
      console.warn('Save failed:', e);
    }
  },
  loadGame() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!data || !data.world || !data.player) return false;
      Object.assign(Game.world, data.world);
      Object.assign(Game.player, data.player);
      loadZone(Game.world.currentZone);
      updateQuestTracker();
      return true;
    } catch (e) {
      toast('ไฟล์เซฟเสียหาย ไม่สามารถโหลดได้');
      return false;
    }
  }
};

// ==========================================
// 11. INPUT HANDLERS & INITIALIZATION
// ==========================================
function setupControls() {
  window.addEventListener('keydown', e => {
    Game.keys[e.code] = true;
    if (Game.state === 'PLAYING') {
      if (e.code === 'KeyE') triggerInteract();
      if (e.code === 'KeyR') reloadWeapon();
      if (e.code === 'KeyI') UI.openModal('inventory');
      if (e.code === 'KeyC' && e.altKey) UI.openModal('crafting');
      if (e.code === 'KeyB') UI.openModal('building');
      if (e.code === 'KeyM') UI.openModal('map');
      if (e.code === 'KeyQ') UI.openModal('quests');
      if (e.code === 'Digit1') selectHotbar(0);
      if (e.code === 'Digit2') selectHotbar(1);
      if (e.code === 'Digit3') selectHotbar(2);
      if (e.code === 'Digit4') selectHotbar(3);
      if (e.code === 'Digit5') selectHotbar(4);
      if (e.code === 'Escape') Game.buildMode.active = false;
    } else if (Game.state === 'PAUSED' && e.code === 'Escape') {
      UI.closeModal();
    }
  });
  window.addEventListener('keyup', e => { Game.keys[e.code] = false; });

  Game.canvas.addEventListener('mousemove', e => {
    Game.mouse.x = e.clientX;
    Game.mouse.y = e.clientY;
    Game.mouse.worldX = e.clientX + Game.cam.x;
    Game.mouse.worldY = e.clientY + Game.cam.y;
    if (Game.state === 'PLAYING') {
      Game.player.angle = Math.atan2(Game.mouse.worldY - Game.player.y, Game.mouse.worldX - Game.player.x);
    }
  });

  Game.canvas.addEventListener('mousedown', e => {
    if (e.button !== 0 || Game.state !== 'PLAYING') return;
    if (Game.buildMode.active && Game.buildMode.type) {
      placeBuilding();
      return;
    }
    Game.mouse.down = true;
    performAttack();
  });
  window.addEventListener('mouseup', () => { Game.mouse.down = false; });

  // Mobile Virtual Joystick
  const jZone = document.getElementById('joystick-zone');
  const jKnob = document.getElementById('joystick-knob');
  jZone.addEventListener('touchstart', e => {
    e.preventDefault();
    Game.joy.active = true;
    updateJoy(e.touches[0]);
  });
  jZone.addEventListener('touchmove', e => {
    e.preventDefault();
    if (Game.joy.active) updateJoy(e.touches[0]);
  });
  jZone.addEventListener('touchend', () => {
    Game.joy.active = false;
    Game.joy.dx = 0; Game.joy.dy = 0;
    jKnob.style.transform = 'translate(0px, 0px)';
  });
  function updateJoy(touch) {
    const rect = jZone.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = touch.clientX - cx;
    let dy = touch.clientY - cy;
    const dist = Math.hypot(dx, dy);
    const maxR = 42;
    if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
    jKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    Game.joy.dx = dx / maxR;
    Game.joy.dy = dy / maxR;
  }

  // Mobile Action Buttons
  document.getElementById('m-attack').addEventListener('touchstart', e => {
    e.preventDefault();
    if (Game.buildMode.active) placeBuilding();
    else performAttack();
  });
  document.getElementById('m-interact').addEventListener('touchstart', e => { e.preventDefault(); triggerInteract(); });
  document.getElementById('m-reload').addEventListener('touchstart', e => { e.preventDefault(); reloadWeapon(); });
  document.getElementById('m-heal').addEventListener('touchstart', e => {
    e.preventDefault();
    const idx = Game.player.inventory.findIndex(s => ITEMS[s.id].type === 'consumable');
    if (idx !== -1) Inv.useSlot(idx);
    else toast('ไม่มีอาหารหรือยาในกระเป๋า');
  });
  document.getElementById('m-sprint').addEventListener('touchstart', e => { e.preventDefault(); Game.mobileSprint = true; });
  document.getElementById('m-sprint').addEventListener('touchend', () => { Game.mobileSprint = false; });
  document.getElementById('m-sneak').addEventListener('touchstart', e => {
    e.preventDefault();
    Game.mobileSneak = !Game.mobileSneak;
    e.target.classList.toggle('active', Game.mobileSneak);
  });

  // UI Buttons
  document.getElementById('minimap-canvas').onclick = () => UI.openModal('map');
  document.getElementById('btn-close-modal').onclick = () => UI.closeModal();
  document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => UI.switchTab(b.dataset.tab));

  document.getElementById('btn-new-game').onclick = () => {
    AudioSys.init();
    localStorage.removeItem(SAVE_KEY);
    document.getElementById('main-menu').classList.add('hidden');
    loadZone('town');
    updateQuestTracker();
    showStory(
      'บทที่ 1: วันแรกหลังการล่มสลาย',
      'โลกเข้าสู่ความเงียบงันหลังไวรัสปริศนาระบาด ผู้คนกลายเป็นซอมบี้กระหายเลือด คุณรอดชีวิตอยู่กลางเมืองร้างพร้อมเสบียงเพียงเล็กน้อย จงค้นหาอาหาร น้ำ อาวุธ สร้างที่พักพิง และสืบหาความจริงของหายนะครั้งนี้...',
      () => {
        startPlaying();
      }
    );
  };

  if (SaveSys.hasSave()) document.getElementById('btn-continue').disabled = false;
  document.getElementById('btn-continue').onclick = () => {
    AudioSys.init();
    if (SaveSys.loadGame()) {
      document.getElementById('main-menu').classList.add('hidden');
      startPlaying();
      toast('โหลดความคืบหน้าสำเร็จ');
    }
  };

  document.getElementById('btn-menu-settings').onclick = () => {
    AudioSys.init();
    Game.state = 'PAUSED';
    UI.openModal('settings');
  };
  document.getElementById('btn-credits').onclick = () => {
    showStory('CREDITS', 'ZOMBIE APOCALYPSE: LAST SURVIVOR — พัฒนาด้วย HTML5 Canvas 2D & Web Audio API ออกแบบสำหรับเล่นบนมือถือและพีซี');
  };
}

function placeBuilding() {
  const bType = Game.buildMode.type;
  const def = BUILDINGS[bType];
  const gx = Math.floor(Game.mouse.worldX / TILE) * TILE;
  const gy = Math.floor(Game.mouse.worldY / TILE) * TILE;
  if (checkRectCollision(gx + 2, gy + 2, TILE - 4, TILE - 4, getAllSolids())) {
    toast('ไม่สามารถสร้างทับสิ่งกีดขวางได้');
    return;
  }
  for (const [rk, rv] of Object.entries(def.req)) {
    if (Inv.getCount(rk) < rv) { toast('วัตถุดิบไม่เพียงพอ'); Game.buildMode.active = false; return; }
  }
  for (const [rk, rv] of Object.entries(def.req)) Inv.remove(rk, rv);

  const z = Game.world.currentZone;
  if (!Game.world.buildings[z]) Game.world.buildings[z] = [];
  Game.world.buildings[z].push({ type: bType, x: gx, y: gy, hp: def.hp, solid: def.solid, open: false });
  advanceQuest('q_side_wood', 1);
  AudioSys.play('loot');
  toast(`สร้าง ${def.name} สำเร็จ!`);
  Game.buildMode.active = false;
  SaveSys.autoSave();
}

function startPlaying() {
  Game.state = 'PLAYING';
  document.getElementById('hud').classList.remove('hidden');
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.getElementById('mobile-controls').classList.remove('hidden');
  }
}

function resize() {
  Game.width = window.innerWidth;
  Game.height = window.innerHeight;
  Game.canvas.width = Game.width;
  Game.canvas.height = Game.height;
  Game.ctx.imageSmoothingEnabled = false;
}

function gameLoop(ts) {
  const dt = Math.min(0.05, (ts - Game.lastTime) / 1000 || 0.016);
  Game.lastTime = ts;

  if (Game.state === 'PLAYING') {
    updateSimulation(dt);
    renderWorld();
  } else if (Game.state === 'MENU') {
    // Animated dark atmospheric menu background
    const ctx = Game.ctx;
    ctx.fillStyle = '#0b0e13';
    ctx.fillRect(0, 0, Game.width, Game.height);
    ctx.fillStyle = '#181e27';
    for (let i = 0; i < 12; i++) {
      const bx = (i * 140 + ts * 0.01) % (Game.width + 140) - 70;
      const bh = 120 + (i % 4) * 55;
      ctx.fillRect(bx, Game.height - bh, 90, bh);
    }
  }

  requestAnimationFrame(gameLoop);
}

// BOOTSTRAP
Game.ctx = Game.canvas.getContext('2d');
Game.mmCtx = Game.mmCanvas.getContext('2d');
window.addEventListener('resize', resize);
resize();
setupControls();
requestAnimationFrame(gameLoop);
</script>
